<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Guesser - 積分商城</title>
    <script src="js/cosmetics.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="asset/shop.css">
</head>
<body>

<nav class="glass-nav">
    <div class="container nav-container">
        <div class="logo" onclick="location.href='index.html'" style="cursor: pointer;">
            <i class="fa-solid fa-crosshairs"></i> 
            Brawl Guesser
        </div>

        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

        <div class="nav-links" id="nav-menu">
            <div class="auth-status-container"></div>
            
            <a href="game.html"><i class="fa-solid fa-gamepad"></i> 開始遊玩</a>
            <a href="quests.html"><i class="fa-solid fa-list-check"></i> 任務中心</a>
            <a href="shop.html" class="active"><i class="fa-solid fa-bag-shopping"></i> 積分商城</a>
            <a href="upload.html"><i class="fa-solid fa-cloud-arrow-up"></i> 影片投稿</a>
        </div>
    </div>
</nav>

<div class="menu-overlay" id="menu-overlay"></div>

<main class="container shop-main">
    <header class="shop-header">
        <div class="section-header">
            <h2>積分商城</h2>
            <p>兌換專屬造型、稱號與頻道互動獎勵</p>
        </div>
    </header>

    <div class="category-tabs" id="category-tabs">
        <div class="tab active" data-category="all">全部</div>
        <div class="tab" data-category="cosmetic">造型</div>
        <div class="tab" data-category="title">稱號</div>
        <div class="tab" data-category="special">特殊獎勵</div>
    </div>

    <div class="shop-grid" id="shop-grid">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>
</main>



<div class="shop-grid"></div>

<div class="purchase-modal-overlay">
    <div class="purchase-modal-box">
        <div class="modal-item-icon"></div>
        <h2 class="modal-item-name">商品名稱</h2>
        <p class="modal-item-desc">細節描述</p>
        <div class="modal-item-price">0</div>
        
        <div class="modal-action-btns">
            <button class="close-modal-btn">取消</button>
            <button class="confirm-buy-btn">確認兌換</button>
        </div>
    </div>
</div>

<script src="js/shop.js"></script>

</body>
</html>
